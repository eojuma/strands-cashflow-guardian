AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CashflowGuardian (AWS "Agents for Humans" hackathon). Memory layer (Clients +
  PendingActions tables) plus the Phase 3 compute surface: the scheduled
  Orchestrator Lambda (EventBridge trigger) and the REST API Lambda in front of
  the Next.js Command Center dashboard.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    # Staged offline by scripts/build_lambda_package.py: only agents/, memory/,
    # lambda_handlers/ plus the runtime dependency closure copied from the
    # project virtualenv. Keeps frontend/node_modules, the venvs, and the
    # dev/test-only packages out of the deployment package.
    CodeUri: ../.lambda_build
    Environment:
      Variables:
        # "log" for dry-run demos (no real Gmail send); "live" for real sends.
        CASHFLOW_SEND_MODE: !Ref SendMode
        # Lambda's task root is read-only; generated PDFs must go under /tmp.
        PDF_OUTPUT_DIR: /tmp/generated

Parameters:
  TableNamePrefix:
    Type: String
    Default: CashflowGuardian
    Description: Prefix for table names. Defaults match memory/schema.py.
  ScheduleExpression:
    Type: String
    Default: rate(15 minutes)
    Description: EventBridge schedule for the orchestrator's scheduled check.
  SendMode:
    Type: String
    Default: log
    AllowedValues: [log, live]
    Description: >
      "log" never sends real email (drafts are logged) — safe for demos and dry
      runs. "live" sends through Gmail after a human approves an action.

Resources:
  ClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TableNamePrefix}-Clients"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH

  PendingActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TableNamePrefix}-PendingActions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: action_id
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: action_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ClientIdIndex
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Scheduled Orchestrator: EventBridge -> lambda_handlers/orchestrator_handler.py
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handlers.orchestrator_handler.lambda_handler
      # Scoped role (no dynamodb:* / bedrock:* wildcards) — see iam-policies/.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: DynamoDBMemoryAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt ClientsTable.Arn
                - !GetAtt PendingActionsTable.Arn
                - !Sub "${PendingActionsTable.Arn}/index/*"
            - Sid: BedrockInvokeModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
            - Sid: CloudWatchLogs
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
      Events:
        ScheduledCheck:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Name: cashflow-guardian-scheduled-check
            Description: Run the Orchestrator's scheduled dunning + scope check.

  # REST surface for the dashboard -> lambda_handlers/api_handler.py
  CommandCenterApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: REST surface consumed by the Next.js Command Center.

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handlers.api_handler.lambda_handler
      # The REST handler is deterministic: DynamoDB + logs only. It never calls
      # Bedrock, so it is not granted Bedrock access.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: DynamoDBMemoryAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt ClientsTable.Arn
                - !GetAtt PendingActionsTable.Arn
                - !Sub "${PendingActionsTable.Arn}/index/*"
            - Sid: CloudWatchLogs
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CommandCenterApi
            Method: ANY
            Path: /{proxy+}

Outputs:
  ClientsTableName:
    Description: Physical name of the Clients table.
    Value: !Ref ClientsTable
  PendingActionsTableName:
    Description: Physical name of the PendingActions table.
    Value: !Ref PendingActionsTable
  ApiEndpoint:
    Description: Base URL for the Command Center REST API.
    Value: !Sub "https://${CommandCenterApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
