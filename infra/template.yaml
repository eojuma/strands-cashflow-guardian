AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CashflowGuardian API, scheduled agent orchestration, and DynamoDB memory.

Parameters:
  TableNamePrefix:
    Type: String
    Default: CashflowGuardian
    Description: Prefix for table names. Defaults match memory/schema.py.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20241022-v2:0

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  ClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TableNamePrefix}-Clients"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH

  PendingActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TableNamePrefix}-PendingActions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: action_id
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: action_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ClientIdIndex
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DashboardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["content-type"]
        AllowMethods: [GET, POST, OPTIONS]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda_handlers.api_handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClientsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingActionsTable
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Path: /{proxy+}
            Method: ANY

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda_handlers.orchestrator_handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClientsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingActionsTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        ScheduledCheck:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Enabled: true

Outputs:
  ClientsTableName:
    Description: Physical name of the Clients table.
    Value: !Ref ClientsTable
  PendingActionsTableName:
    Description: Physical name of the PendingActions table.
    Value: !Ref PendingActionsTable
  ApiUrl:
    Description: Dashboard REST API base URL.
    Value: !Sub "https://${DashboardApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
